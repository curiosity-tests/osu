on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
  pull_request:
name: Continuous Integration

# racecar fork-testbed patch. Changes from upstream:
#   1. workflow_dispatch with a `leg` input, so racecar can trigger a run and
#      choose baseline vs instrumented. Upstream fires on push/PR, which racecar
#      cannot drive.
#   2. actions/checkout -> crashappsec/action-checkout, which wraps checkout and
#      setup-chalk-action together. `chalk:` is the single variable separating
#      the two arms, and `profile:` selects the observables profile.
#   3. permissions: id-token: write for the action's OIDC connect. Declaring the
#      block zeroes every unlisted scope, so the rest is restated.
#   4. A fail-closed assertion on the instrumented arm.
#   5. fail-fast: false on every matrix -- a measurement-integrity change, not a
#      build change: the instrumented arm has strictly more failure surface, so
#      fail-fast cancels its siblings more often than baseline's and biases the
#      comparison.
# Build and test COMMANDS are byte-identical to upstream.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
  cancel-in-progress: false

permissions:
  contents: read # to fetch code (actions/checkout)
  security-events: write # for reporting InspectCode issues
  id-token: write

run-name: "Continuous Integration ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

env:
  # The one variable that separates the arms. On baseline, action-checkout
  # skips its Set up Chalk step entirely. The github.event_name guard keeps
  # incidental push/PR runs uninstrumented, where inputs.leg is empty.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

jobs:
  inspect-code:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          # inert at action-checkout@main (not an input there); kept for forward-compat
          observables_continue_on_error: false
          # action-checkout defaults LFS on; actions/checkout does not
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Install .NET 8.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore Tools
        run: dotnet tool restore

      - name: Restore Packages
        run: dotnet restore osu.Desktop.slnf

      - name: Restore inspectcode cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/inspectcode
          key: inspectcode-${{ hashFiles('.config/dotnet-tools.json', '.github/workflows/ci.yml', 'osu.sln*', 'osu*.slnf', '.editorconfig', '.globalconfig', 'CodeAnalysis/*', '**/*.csproj', '**/*.props') }}

      - name: Dotnet code style
        run: dotnet build -c Debug -warnaserror osu.Desktop.slnf -p:EnforceCodeStyleInBuild=true

      - name: CodeFileSanity
        run: |
          # TODO: Add ignore filters and GitHub Workflow Command Reporting in CFS. That way we don't have to do this workaround.
          # FIXME: Suppress warnings from templates project
          exit_code=0
          while read -r line; do
            if [[ ! -z "$line" ]]; then
              echo "::error::$line"
              exit_code=1
            fi
          done <<< $(dotnet codefilesanity)
          exit $exit_code

      - name: InspectCode
        uses: JetBrains/ReSharper-InspectCode@v0.12
        with:
          # this is WTF tier but if you don't specify *both* of these the defaults assume `build: true`
          build: false
          no-build: true
          solution: ./osu.Desktop.slnf
          caches-home: inspectcode
          verbosity: WARN

  test:
    name: Test
    runs-on: ${{matrix.os.fullname}}
    env:
      OSU_EXECUTION_MODE: ${{matrix.threadingMode}}
    strategy:
       fail-fast: false
       matrix:
          os:
            - { prettyname: Linux, fullname: ubuntu-latest }
          threadingMode: ['SingleThread', 'MultiThreaded']
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          # inert at action-checkout@main (not an input there); kept for forward-compat
          observables_continue_on_error: false
          # action-checkout defaults LFS on; actions/checkout does not
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Install .NET 8.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Compile
        run: dotnet build -c Debug -warnaserror osu.Desktop.slnf

      - name: Test
        run: >
          dotnet test
          osu.Game.Tests/bin/Debug/**/osu.Game.Tests.dll
          osu.Game.Rulesets.Osu.Tests/bin/Debug/**/osu.Game.Rulesets.Osu.Tests.dll
          osu.Game.Rulesets.Taiko.Tests/bin/Debug/**/osu.Game.Rulesets.Taiko.Tests.dll
          osu.Game.Rulesets.Catch.Tests/bin/Debug/**/osu.Game.Rulesets.Catch.Tests.dll
          osu.Game.Rulesets.Mania.Tests/bin/Debug/**/osu.Game.Rulesets.Mania.Tests.dll
          osu.Game.Tournament.Tests/bin/Debug/**/osu.Game.Tournament.Tests.dll
          Templates/**/*.Tests/bin/Debug/**/*.Tests.dll
          --logger "trx;LogFileName=TestResults-${{matrix.os.prettyname}}-${{matrix.threadingMode}}.trx"
          --
          NUnit.ConsoleOut=0

      # Attempt to upload results even if test fails.
      # https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#cancelled
      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: osu-test-results-${{matrix.os.prettyname}}-${{matrix.threadingMode}}
          path: ${{github.workspace}}/TestResults/TestResults-${{matrix.os.prettyname}}-${{matrix.threadingMode}}.trx

  test-results:
    name: Test results
    runs-on: ubuntu-latest
    # we want to wait for the `test` job to complete, but run regardless of whether it succeeds or fails
    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#example-not-requiring-successful-dependent-jobs
    if: ${{ !cancelled() }}
    needs: test
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          # inert at action-checkout@main (not an input there); kept for forward-compat
          observables_continue_on_error: false
          # action-checkout defaults LFS on; actions/checkout does not
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Download results
        uses: actions/download-artifact@v8
        with:
          pattern: osu-test-results-*
          merge-multiple: true

      - name: Add test results summary to workflow run
        uses: dorny/test-reporter@v3.0.0
        with:
          name: Results
          path: "*.trx"
          reporter: dotnet-trx
          list-suites: 'failed'
          list-tests: 'failed'
          use-actions-summary: 'true'


